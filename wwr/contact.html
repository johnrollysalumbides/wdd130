<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar White Water Rafting</title>
    <meta name="description"
      content="Contact Dry Oar White Water Rafting to book a trip, ask questions about our rafting adventures, or get help planning your day on the river.">
    <meta name="author" content="John Rolly Salumbides">
    <link rel="stylesheet" href="styles/rafting.css">
    <!-- Page-specific styles: you can move these into styles/rafting.css -->
   
</head>

<body>
    <header>
        <img src="images/z-dryoarlogo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact-information">
            <h1>Dry Oar Water Rafting</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        

        <div class="contact-row">
            <div class="map">
                <iframe
                  title="Map showing the Dry Oar location"
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7723.3850625724535!2d121.57333802504424!3d14.55956720309455!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1791745377319!5m2!1sen!2sph"

                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <h2>Send Us a Message</h2>

                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Your Message</legend>
                    <div>
                        <input type="radio" id="purpose-general" name="purpose" value="general-inquiry" required>
                        <label for="purpose-general">General Inquiry</label>
                    </div>
                    <div>
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation-question">
                        <label for="purpose-reservation">Reservation Question</label>
                    </div>
                    <div>
                        <input type="radio" id="purpose-suggestion" name="purpose" value="website-suggestion">
                        <label for="purpose-suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </div>

        <section class="team">
            <h2>Meet Our Team</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of John Salumbides">
                    <figcaption>John Salumbides<br>Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of Rolly Salumbides">
                    <figcaption>Rolly Salumbides<br>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of Abrera Salumbides">
                    <figcaption>Abrera Salumbides<br>Customer Service Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 | Dry Oar | John Rolly Salumbides </p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.svg" alt="Facebook Logo">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.svg" alt="Instagram Logo">
            </a>
            <a href="https://www.youtube.com/">
                <img src="images/youtube.svg" alt="Youtube Logo">
            </a>
        </nav>
    </footer>
</body>

</html>
